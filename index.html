<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>라스베가스 (Las Vegas)</title>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
:root{--ds:52px;--gold:#e0b84a;}
@media(max-width:700px){:root{--ds:42px}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Noto Sans KR',sans-serif;color:#f5ecd2;min-height:100vh;
 background:radial-gradient(ellipse at top,#3a1a12 0%,#1a0a06 70%) fixed}
.hidden{display:none!important}
.screen{max-width:1200px;margin:0 auto;padding:12px}
.logo{font-family:'Black Han Sans',sans-serif;text-align:center;font-size:clamp(38px,8vw,72px);letter-spacing:4px;
 color:#ffd76a;text-shadow:0 3px 0 #a5301e,0 6px 0 #5b130b,0 10px 18px #000;margin:14px 0 2px}
.sub{text-align:center;color:#d9c48a;margin-bottom:16px}
.panel{background:rgba(0,0,0,.35);border:2px solid #7d4d26;border-radius:14px;padding:16px;margin:12px auto;max-width:560px}
.panel h3{margin-bottom:10px;color:#ffd76a}
.panel input,.panel select{padding:9px 10px;border-radius:8px;border:2px solid #7d4d26;background:#22110a;color:#fff;font-size:15px;margin:3px 4px 3px 0;font-family:inherit}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:6px 0}
.btn{cursor:pointer;border:none;border-radius:10px;padding:10px 16px;font-weight:900;font-size:15px;font-family:inherit;
 color:#3a1a00;background:linear-gradient(#ffe38a,#e0a92a);box-shadow:0 3px 0 #8a5d10,0 5px 8px #0008}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #8a5d10}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.xl{font-size:18px;padding:13px 26px}
.btn.sm{padding:6px 10px;font-size:13px}
.btn.dark{background:linear-gradient(#5a3a22,#3a2213);color:#f5ecd2;box-shadow:0 3px 0 #1c0f07}

/* header */
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin-bottom:8px}
.top .ttl{font-family:'Black Han Sans';font-size:26px;color:#ffd76a;text-shadow:0 2px 0 #5b130b}
.top .info{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.badge{background:#000a;border:1px solid #7d4d26;border-radius:20px;padding:4px 12px}

/* table */
.table{border:14px solid #5a3519;border-radius:22px;padding:12px;
 background:radial-gradient(ellipse at center,#12805a 0%,#0b5a3b 65%,#08402b 100%),
 repeating-linear-gradient(45deg,rgba(255,255,255,.02) 0 2px,transparent 2px 4px);
 box-shadow:inset 0 0 50px #000a,0 0 0 3px #7d4d26,0 12px 30px #000c}
#casinos{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
@media(max-width:820px){#casinos{grid-template-columns:repeat(3,1fr)}}
.casino{display:flex;flex-direction:column;gap:6px;cursor:default;border-radius:12px;padding:4px;transition:.2s}
.casino.target{box-shadow:0 0 0 3px #fff,0 0 22px 6px var(--gold);cursor:pointer;background:#ffffff14}
.bills{display:flex;flex-direction:column;gap:3px;min-height:188px}
@media(max-width:700px){.bills{min-height:150px}}
.bill{position:relative;height:34px;border-radius:4px;display:flex;align-items:center;justify-content:space-between;gap:4px;padding:0 8px;
 background:linear-gradient(135deg,#d8ecb9,#a2cc7f 60%,#c5e2a2);border:2px solid #4c7a34;
 box-shadow:inset 0 0 0 2px #e9f5d6,0 2px 3px #0009;color:#264a17;font-size:14px;transform:rotate(var(--r,0deg))}
.bill b{font-weight:900;letter-spacing:.5px}
@media(max-width:700px){.bill{height:28px;font-size:12px;padding:0 5px}}
.bill.lost{opacity:.45;filter:grayscale(.7)}
.bill.won{box-shadow:inset 0 0 0 2px #fff6,0 0 10px 2px #ffe38a}
.bill.rv{animation:billIn .6s var(--d,0s) both}
@keyframes billIn{0%{transform:translateY(-20px) scale(1.3) rotate(8deg);opacity:0}100%{opacity:1}}
.tag{font-size:11px;font-weight:900;border-radius:10px;padding:1px 7px;background:var(--c);max-width:52%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 1px 2px #0008}
.tag.lost{background:#555;color:#eee}
.tile{border-radius:10px;padding:7px;background:linear-gradient(160deg,#9a2020,#4a0c0c);border:3px solid var(--gold);
 box-shadow:inset 0 0 12px #000a,0 3px 6px #0009}
.big{aspect-ratio:1;background:radial-gradient(circle,#2a1a1a,#0b0606);border-radius:10px;border:2px solid #000;--p:#ffd76a}
.big .pips{padding:12%}
.big .pips i.on{box-shadow:0 0 8px #ffb300,inset 0 -2px 3px #a6741b}
.zone{min-height:78px;background:#0003;border-radius:8px;padding:4px;display:flex;flex-direction:column;gap:4px;box-shadow:inset 0 0 8px #0008}
.grp{display:flex;flex-wrap:wrap;align-items:center;gap:2px;padding:2px 3px;border-radius:5px;background:#0003;border-left:4px solid var(--c)}
.grp.cx{opacity:.4;filter:grayscale(.8);text-decoration:line-through}
.cnt{margin-left:auto;font-weight:900;font-size:13px;padding:0 4px}

/* pips & dice */
.pips{width:100%;height:100%;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);padding:15%}
.pips i{display:block;border-radius:50%;background:var(--p);margin:8%;box-shadow:inset 0 -2px 2px #0006}
.pips i:not(.on){visibility:hidden}
.mini{display:inline-block;width:23px;height:23px;border-radius:5px;flex:none;
 background:linear-gradient(145deg,#fff5,#0004),var(--c);box-shadow:0 2px 3px #000a,inset 0 0 0 1px #fff4}
.mini .pips{padding:12%}.mini .pips i{margin:5%}
.mini.drop{animation:drop .55s cubic-bezier(.3,.7,.4,1) both}
@keyframes drop{0%{transform:translateY(-60px) scale(2) rotate(-70deg);opacity:0}55%{opacity:1;transform:translateY(0) scale(1.2) rotate(15deg)}75%{transform:translateY(-6px) scale(1) rotate(-6deg)}100%{transform:none}}
.chip .mini{width:28px;height:28px}

/* tray */
.trayWrap{margin-top:12px}
#tray{position:relative;height:230px;border-radius:16px;overflow:hidden;border:12px solid #5a3519;
 background:radial-gradient(ellipse at center,#0f7a52,#083b28);box-shadow:inset 0 0 40px #000c,0 0 0 2px #7d4d26}
@media(max-width:700px){#tray{height:200px}}
#tray .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#ffffff40;font-size:22px;font-weight:900}
.die3d{position:absolute;width:var(--ds);height:var(--ds);perspective:420px;cursor:pointer;filter:drop-shadow(5px 8px 4px #0009)}
.cube{position:relative;width:100%;height:100%;transform-style:preserve-3d}
.face{position:absolute;inset:0;border-radius:14%;
 background:linear-gradient(145deg,#ffffff55,#00000040),var(--c);box-shadow:inset 0 0 0 2px #ffffff30,inset 0 0 10px #0005;backface-visibility:hidden}
.f1{transform:translateZ(calc(var(--ds)/2))}
.f6{transform:rotateY(180deg) translateZ(calc(var(--ds)/2))}
.f3{transform:rotateY(90deg) translateZ(calc(var(--ds)/2))}
.f4{transform:rotateY(-90deg) translateZ(calc(var(--ds)/2))}
.f2{transform:rotateX(90deg) translateZ(calc(var(--ds)/2))}
.f5{transform:rotateX(-90deg) translateZ(calc(var(--ds)/2))}
.die3d.hl .face{box-shadow:0 0 0 3px #fff8,inset 0 0 10px #0005}
.die3d.sel{animation:hop .5s ease-in-out infinite alternate}
.die3d.sel .face{box-shadow:0 0 0 3px #fff,0 0 16px 5px var(--gold)}
@keyframes hop{to{transform:translateY(-7px)}}

#action{margin-top:10px;text-align:center;min-height:90px}
.say{margin-bottom:8px;font-weight:700}
.wait{color:#d9c48a;padding:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:10px}
.chip{cursor:pointer;display:flex;align-items:center;gap:8px;border-radius:24px;border:2px solid #7d4d26;background:#22110a;color:#fff;padding:6px 14px;font-weight:700;font-family:inherit;font-size:15px}
.chip.on{border-color:#fff;box-shadow:0 0 12px 2px var(--gold);background:#4a2a12}

/* players */
#players{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:12px}
.pl{display:flex;align-items:center;gap:8px;background:#0006;border:2px solid #5a3519;border-left:8px solid var(--c);border-radius:10px;padding:7px 10px;font-size:14px}
.pl.act{border-color:var(--gold);box-shadow:0 0 14px 2px var(--gold);background:#3a2a0a99}
.pl .meta{font-size:12px;color:#d9c48a;display:block}

/* modal */
#modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
#modal .box{background:#2a1409;border:3px solid var(--gold);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:88vh;overflow:auto;line-height:1.6}
#modal h2{color:#ffd76a;margin-bottom:8px;font-family:'Black Han Sans'}
#modal li{margin-left:20px;margin-bottom:5px}
.rank{display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;background:#0005;margin:6px 0;border-left:8px solid var(--c)}
.rank.win{background:#5a460a;box-shadow:0 0 12px #ffd76a}

/* 접속 점 / 알림 / 채팅 */
.dot{width:10px;height:10px;border-radius:50%;background:#7f8c8d;flex:none;display:inline-block;vertical-align:middle;margin-right:4px}
.dot.good{background:#2ecc71}.dot.mid{background:#f1c40f}.dot.bad{background:#e67e22}
.dot.stale{background:#e74c3c}.dot.off{background:#7f8c8d}
#connBar{display:none;position:fixed;top:0;left:0;width:100%;background:#d32f2f;color:#fff;font-weight:800;font-size:.85rem;padding:7px;z-index:60;text-align:center}
#connBar.on{display:block}
#toast{display:none;position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#000d;border:2px solid var(--gold);color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-weight:700;max-width:90vw;text-align:center}
.pl.left{opacity:.5}
.awaybox{margin-top:8px;padding:8px 12px;border-radius:10px;background:#5a1a1a;border:2px solid #d32f2f;font-weight:700}
.awaybox small{color:#d9c48a;font-weight:400}
.chat-btn{position:fixed;right:14px;bottom:74px;z-index:45;width:52px;height:52px;border-radius:50%;padding:0;font-size:23px;display:none;align-items:center;justify-content:center;background:var(--gold);color:#000;border:0;box-shadow:0 4px 0 #8a5d10;cursor:pointer}
.chat-btn.on{display:flex}
.chat-badge{position:absolute;top:-4px;right:-4px;background:#d32f2f;color:#fff;font-size:.72rem;border-radius:999px;min-width:20px;height:20px;display:none;align-items:center;justify-content:center;padding:0 5px;border:2px solid #1a0a06}
.chat-badge.on{display:flex}
.chat-box{position:fixed;right:14px;bottom:134px;z-index:46;width:300px;max-width:92vw;max-height:56vh;display:none;flex-direction:column;background:#2a1409;border:2px solid var(--gold);border-radius:16px;overflow:hidden}
.chat-box.on{display:flex}
.chat-top{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:rgba(0,0,0,.35);font-weight:700;color:#ffd76a}
.chat-top button{background:transparent;border:0;cursor:pointer;color:#d9c48a;font-size:.85rem;font-family:inherit}
.chat-log{flex:1;overflow-y:auto;padding:9px 12px;display:flex;flex-direction:column;gap:5px;min-height:110px;font-size:.92rem;text-align:left}
.chat-m{line-height:1.45;word-break:break-word}
.chat-m .who{color:#ffd76a;margin-right:5px;font-weight:800}
.chat-m.me .who{color:#8be07a}
.chat-none{opacity:.55;font-size:.86rem;text-align:center;margin:auto 0}
.chat-tip{display:none;padding:6px 12px;font-size:.83rem;background:var(--gold);color:#000;font-weight:700}
.chat-tip.on{display:block}
.chat-in{display:flex;gap:6px;padding:9px;border-top:1px solid #5a3519}
.chat-in input{font-size:.92rem;padding:8px 10px;min-width:0;flex:1;border-radius:8px;border:2px solid #7d4d26;background:#22110a;color:#fff;font-family:inherit}
@media(max-width:520px){.chat-box{right:4vw;left:4vw;width:auto}}
.homebtns{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:18px 0}
#mHome{margin-top:5vh}
.btn.ghost{background:transparent;color:#f5ecd2;border:2px solid #ffffff33;box-shadow:none;font-weight:700;padding:9px 20px}
.btn.ghost:hover{background:#ffffff14}
#rejoin{display:flex;justify-content:center}
.credit{text-align:center;color:#ffffff55;font-size:13px;margin:36px 0 12px}
</style>
</head>
<body>

<!-- MENU -->
<div id="menu" class="screen">
  <h1 class="logo">LAS VEGAS</h1>
  <p class="sub">라스베가스 · 주사위 보드게임 (2~5명)</p>

  <div id="mHome">
    <div class="homebtns">
      <button class="btn xl" onclick="menuPane('local')">로컬 게임</button>
      <button class="btn xl" onclick="menuPane('online')">온라인 게임</button>
    </div>
    <div class="homebtns"><button class="btn ghost" onclick="showRules()">게임 방법</button></div>
    <div id="rejoin"></div>
    <div class="credit">made by m00n</div>
  </div>

  <div id="mLocal" class="hidden">
    <div class="panel">
      <h3>🏠 로컬 게임 <small style="font-weight:400;color:#d9c48a">(한 화면에서 번갈아)</small></h3>
      <div class="row">인원 <select id="lpn" onchange="buildNames()"><option>2</option><option>3</option><option selected>4</option><option>5</option></select></div>
      <div id="lnames"></div>
      <div class="row" style="margin-top:10px">
        <button class="btn" onclick="startLocal()">게임 시작</button>
        <button class="btn dark" onclick="menuPane('home')">← 뒤로</button>
      </div>
    </div>
  </div>

  <div id="mOnline" class="hidden">
    <div class="panel">
      <h3>🌐 온라인 게임</h3>
      <div class="row"><input id="oname" placeholder="내 이름" maxlength="10"></div>
      <div class="row"><button class="btn" onclick="createRoom()">방 만들기</button></div>
      <div class="row"><input id="ocode" placeholder="방 코드" maxlength="4" style="width:110px;text-transform:uppercase">
        <button class="btn" onclick="joinRoom()">참가</button></div>
      <div class="row" style="margin-top:10px"><button class="btn dark" onclick="menuPane('home')">← 뒤로</button></div>
    </div>
  </div>
</div>

<!-- LOBBY -->
<div id="lobby" class="screen hidden">
  <h1 class="logo">LAS VEGAS</h1>
  <div class="panel" style="text-align:center">
    <p>방 코드</p>
    <div id="lcode" style="font-family:'Black Han Sans';font-size:56px;letter-spacing:10px;color:#ffd76a"></div>
    <div style="margin-top:6px"><button class="btn sm dark" onclick="copyLink()">🔗 초대 링크 복사</button></div>
    <div id="lplayers" style="text-align:left;margin:12px 0"></div>
    <p id="lwait" style="color:#d9c48a;margin-bottom:8px"></p>
    <button id="lstart" class="btn xl" onclick="startOnline()">게임 시작</button>
    <button class="btn dark" onclick="leaveRoom()">나가기</button>
  </div>
</div>

<!-- GAME -->
<div id="game" class="screen hidden">
  <div class="top">
    <div class="ttl">LAS VEGAS</div>
    <div class="info">
      <span class="badge" id="hRound"></span>
      <span class="badge" id="hTurn"></span>
    </div>
    <div>
      <button class="btn sm dark" onclick="showRules()">📖 규칙</button>
      <button class="btn sm dark" id="bSnd" onclick="toggleSnd()">🔊</button>
      <button class="btn sm dark" onclick="toggleMoney()">💰 금액</button>
      <button class="btn sm dark" onclick="toMenu()">🏠</button>
    </div>
  </div>
  <div class="table">
    <div id="casinos"></div>
  </div>
  <div class="trayWrap">
    <div id="tray"></div>
    <div id="action"></div>
    <div id="away"></div>
  </div>
  <div id="players"></div>
</div>

<div id="connBar">연결이 끊겼어요 — 다시 연결하는 중…</div>
<div id="toast"></div>
<button class="chat-btn" id="chatBtn" aria-label="채팅 열기">💬<span class="chat-badge" id="chatBadge">0</span></button>
<div class="chat-box" id="chatBox" role="dialog" aria-label="채팅">
  <div class="chat-top"><span>💬 채팅</span><button id="chatClose">✕ 닫기</button></div>
  <div class="chat-log" id="chatLog"></div>
  <div class="chat-tip" id="chatTip"></div>
  <div class="chat-in">
    <input type="text" id="chatInput" maxlength="150" placeholder="메시지 입력...">
    <button class="btn sm" id="chatSend">보내기</button>
  </div>
</div>
<div id="modal" class="hidden"><div class="box" id="modalBox"></div></div>

<script>
/* ============ Firebase 설정 (본인 프로젝트 값으로 교체) ============ */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB7E-A8Tfv30VGSKBIUhmxBHMf4U7hlflc",
  authDomain: "lasvegas-e9826.firebaseapp.com",
  databaseURL: "https://lasvegas-e9826-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "lasvegas-e9826",
  storageBucket: "lasvegas-e9826.firebasestorage.app",
  messagingSenderId: "757593935887",
  appId: "1:757593935887:web:445c283238217b5dacd37a"
};

/* ============ 유틸 ============ */
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

const COLORS=[
  {n:'빨강',c:'#d32f2f',p:'#fff'},
  {n:'파랑',c:'#1e5fd0',p:'#fff'},
  {n:'노랑',c:'#f4c20d',p:'#222'},
  {n:'보라',c:'#7b3fc4',p:'#fff'},
  {n:'주황',c:'#ef7d1a',p:'#222'}
];
const WHITE={n:'흰색',c:'#f3efe4',p:'#222'};
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const ROT={1:[0,0],6:[0,180],3:[0,-90],4:[0,90],2:[-90,0],5:[90,0]}; // [rotateX, rotateY]로 해당 눈을 앞면으로

/* ============ 게임 규칙 (순수 로직) ============ */
// 지폐 54장: 1만×6, 2만×8, 3만×8, 4만×6, 5만×6, 6만×5, 7만×5, 8만×5, 9만×5
const BILL_COUNTS={10:6,20:8,30:8,40:6,50:6,60:5,70:5,80:5,90:5};
function newDeck(){const d=[];for(const [v,c] of Object.entries(BILL_COUNTS))for(let i=0;i<c;i++)d.push(+v*1000);return shuffle(d);}
function drawBills(deck){ // 합계가 5만 이상이 될 때까지 뽑음
  const bills=[];let sum=0;
  while(sum<50000){
    if(!deck.length)deck.push(...newDeck()); // 안전장치(정상 게임에선 발생하지 않음)
    const b=deck.pop();bills.push(b);sum+=b;
  }
  return bills.sort((a,b)=>b-a);
}
function makeGame(names,uids){
  const n=names.length;
  const G={n,per:n===5?6:8,neutral:n===2,round:1,phase:'roll',turn:0,actor:'p',nd:0,
    players:names.map((nm,i)=>({name:nm,uid:uids?uids[i]:null,color:i,dice:0,bills:[]})),
    casinos:[],deck:newDeck(),tray:{values:[],seq:0},last:null,
    startPlayer:Math.floor(Math.random()*n)};
  setupRound(G);return G;
}
function setupRound(G){
  G.casinos=[];
  for(let i=0;i<6;i++)G.casinos.push({bills:drawBills(G.deck),placed:{}});
  G.players.forEach(p=>p.dice=p.left?0:G.per);
  G.nd=G.neutral?8:0;
  G.turn=G.startPlayer;G.actor='p';G.phase='roll';
  G.tray={values:[],seq:G.tray.seq};G.last=null;
}
function doRoll(G){
  const cnt=G.actor==='p'?G.players[G.turn].dice:G.nd;
  const vals=[];for(let i=0;i<cnt;i++)vals.push(1+Math.floor(Math.random()*6));
  G.tray={values:vals,seq:G.tray.seq+1};G.phase='choose';
}
function doPlace(G,v){
  const cnt=G.tray.values.filter(x=>x===v).length;if(!cnt)return;
  const who=G.actor==='p'?String(G.turn):'n';
  const c=G.casinos[v-1];c.placed[who]=(c.placed[who]||0)+cnt;
  if(G.actor==='p')G.players[G.turn].dice-=cnt;else G.nd-=cnt;
  G.tray={values:[],seq:G.tray.seq};
  nextStep(G);
}
function nextStep(G){
  // 2인 게임: 내 주사위를 놓은 뒤 이어서 중립(흰색) 주사위 처리
  if(G.actor==='p'&&G.neutral&&G.nd>0){G.actor='n';G.phase='roll';return;}
  if(G.players.every(p=>p.dice===0)&&G.nd===0){scoreRound(G);return;}
  for(let k=1;k<=G.n;k++){
    const i=(G.turn+k)%G.n;
    if(G.players[i].dice>0||(G.neutral&&G.nd>0)){
      G.turn=i;G.actor=G.players[i].dice>0?'p':'n';G.phase='roll';return;
    }
  }
}
function scoreRound(G){
  const res=[];
  G.casinos.forEach(c=>{
    const ents=Object.entries(c.placed).filter(([,n])=>n>0).map(([who,count])=>({who,count}));
    const by={};ents.forEach(e=>(by[e.count]=by[e.count]||[]).push(e));
    ents.forEach(e=>e.cancelled=by[e.count].length>1); // 같은 개수끼리는 모두 무효
    const live=ents.filter(e=>!e.cancelled).sort((a,b)=>b.count-a.count);
    const awards=c.bills.map((b,k)=>{
      const e=live[k];if(!e)return null;               // 받을 사람이 없으면 지폐 버림
      if(e.who!=='n')G.players[+e.who].bills.push(b);  // 중립 플레이어는 돈을 받지 않음
      return e.who;
    });
    ents.sort((a,b)=>b.count-a.count);
    res.push({ents,awards});
  });
  G.last=res;
  G.phase=G.round>=4?'gameEnd':'roundEnd';
}
function nextRound(G){
  G.round++;
  let st=(G.startPlayer+1)%G.n;                      // 시작 플레이어 토큰은 왼쪽으로 이동
  for(let k=0;k<G.n&&G.players[st].left;k++)st=(st+1)%G.n; // 나간 사람은 건너뜀
  G.startPlayer=st;
  setupRound(G);
}
/* 게임 도중 나간 플레이어 처리: 이미 놓은 주사위는 판에 남고(다수결 계산 유지), 더 이상 차례가 오지 않는다 */
function quitPlayer(G,uid){
  const i=G.players.findIndex(p=>p.uid===uid);
  if(i<0||G.players[i].left)return;
  G.players[i].left=true;G.players[i].dice=0;
  if(G.players.filter(p=>!p.left).length<2){        // 혼자 남으면 게임 종료
    G.phase='gameEnd';G.aborted=true;G.last=null;G.tray={values:[],seq:G.tray.seq};return;
  }
  if(G.phase==='roll'||G.phase==='choose'){
    if(G.turn===i&&G.actor==='p'){G.tray={values:[],seq:G.tray.seq};nextStep(G);}
    else if(G.players.every(p=>p.dice===0)&&G.nd===0)scoreRound(G);
  }
}

/* ============ 사운드 (WebAudio) ============ */
let AC=null,snd=true;
function ac(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function noise(t,len,f,q,vol,type){
  if(!snd)return;const a=ac();if(!a)return;
  const n=Math.floor(a.sampleRate*len),buf=a.createBuffer(1,n,a.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/n,2.5);
  const s=a.createBufferSource();s.buffer=buf;
  const fl=a.createBiquadFilter();fl.type=type||'bandpass';fl.frequency.value=f;fl.Q.value=q;
  const g=a.createGain();g.gain.value=vol;
  s.connect(fl);fl.connect(g);g.connect(a.destination);s.start(a.currentTime+t);
}
function thud(t,f,vol){
  if(!snd)return;const a=ac();if(!a)return;
  const o=a.createOscillator(),g=a.createGain(),T=a.currentTime+t;
  o.frequency.setValueAtTime(f,T);o.frequency.exponentialRampToValueAtTime(f*.4,T+.08);
  g.gain.setValueAtTime(vol,T);g.gain.exponentialRampToValueAtTime(.001,T+.1);
  o.connect(g);g.connect(a.destination);o.start(T);o.stop(T+.12);
}
function impact(t,vol){noise(t,.06,1800+Math.random()*2500,1.5,vol);thud(t,140+Math.random()*80,vol*.5);}
function sndRoll(delay,dur){
  const d=delay/1000,D=dur/1000;
  noise(d,D*.5,900,.8,.22);
  impact(d+D*.5,.6);impact(d+D*.68,.4);impact(d+D*.82,.25);impact(d+D*.92,.14);
}
function sndPlace(){impact(0,.55);}
function sndBills(){for(let i=0;i<6;i++)noise(i*.09,.12,4500,.7,.22,'highpass');}
function toggleSnd(){snd=!snd;$('bSnd').textContent=snd?'🔊':'🔇';}

/* ============ 커밋 / 동기화 ============ */
function commit(g){
  if(mode==='local'){G=g;onState();}
  else roomRef.child('state').set(JSON.stringify(g));
}
function onState(){
  if(!G)return;
  if(G.phase!=='choose')sel=null;

  if(G.phase==='gameEnd'&&endShown!==G.round+'e'){endShown=G.round+'e';setTimeout(showEnd,firstSync?300:900);}
  firstSync=false;

/* ============ 액션 ============ */
function actRoll(){
  if(!canAct()||G.phase!=='roll'||Date.now()<rollEnd)return;
  ac();const g=clone(G);doRoll(g);commit(g);
}
function pick(v){
  if(!canAct()||G.phase!=='choose'||Date.now()<rollEnd)return;
  if(!G.tray.values.includes(v))return;
  if(sel===v){actPlace();return;}
  sel=v;refreshSel();
}
function casinoClick(v){
  if(!canAct()||G.phase!=='choose'||Date.now()<rollEnd)return;
  if(G.tray.values.includes(v))pick(v);
}
function actPlace(){
  if(!canAct()||G.phase!=='choose'||sel==null||Date.now()<rollEnd)return;
  const g=clone(G);doPlace(g,sel);sel=null;sndPlace();commit(g);
}
function actNext(){
  if(G.phase!=='roundEnd')return;
  const g=clone(G);nextRound(g);commit(g);
}
function hl(v,on){document.querySelectorAll('#tray .die3d').forEach(d=>{if(+d.dataset.v===v)d.classList.toggle('hl',!!on);});}

/* ============ 주사위 트레이 (3D 굴림) ============ */
function makeDie3D(col){
  const w=document.createElement('div');w.className='die3d';
  w.style.setProperty('--c',col.c);w.style.setProperty('--p',col.p);
  const cube=document.createElement('div');cube.className='cube';
  [1,6,3,4,2,5].forEach(v=>{const f=document.createElement('div');f.className='face f'+v;f.innerHTML=pips(v);cube.appendChild(f);});
  w.appendChild(cube);return w;
}
function scatter(n,W,H,D){
  const pts=[];let tries=0;
  while(pts.length<n&&tries<4000){
    tries++;
    const x=8+Math.random()*Math.max(1,W-D-16),y=8+Math.random()*Math.max(1,H-D-16);
    if(pts.every(p=>Math.hypot(p.x-x,p.y-y)>D*1.3))pts.push({x,y});
  }
  while(pts.length<n){const i=pts.length;pts.push({x:8+(i%4)*D*1.4,y:8+Math.floor(i/4)*D*1.4});}
  return pts;
}
function syncTray(){
  const t=$('tray');
  if(G.phase!=='choose'){
    if(trayKey!==null||!t.firstChild){t.innerHTML='<div class="ph">🎲 주사위 트레이</div>';trayKey=null;}
    return;
  }
  const key=G.round+'-'+G.tray.seq;
  if(key===trayKey)return;
  trayKey=key;t.innerHTML='';
  const animate=!firstSync;
  const vals=G.tray.values,col=curColor();
  const W=t.clientWidth,H=t.clientHeight,D=parseFloat(getComputedStyle(t).getPropertyValue('--ds'))||52;
  const pts=scatter(vals.length,W,H,D);
  let maxEnd=0;
  vals.forEach((v,i)=>{
    const w=makeDie3D(col),cube=w.firstChild;
    const z=Math.random()*50-25;
    const fin=`rotateZ(${z}deg) rotateX(-14deg) rotateY(12deg) rotateX(${ROT[v][0]}deg) rotateY(${ROT[v][1]}deg)`;
    cube.style.transform=fin;
    w.style.left=pts[i].x+'px';w.style.top=pts[i].y+'px';w.dataset.v=v;
    w.onclick=()=>pick(v);
    w.onmouseenter=()=>hl(v,1);w.onmouseleave=()=>hl(v,0);
    t.appendChild(w);
    if(animate){
      const dur=1000+Math.random()*350,delay=i*70+Math.random()*90;
      const left=Math.random()<.5;
      const sx=left?-(pts[i].x+D*2+Math.random()*80):(W-pts[i].x+D+Math.random()*80);
      const sy=(Math.random()-.5)*H*1.2;
      w.animate([
        {transform:`translate(${sx}px,${sy}px) scale(1.9)`,offset:0,easing:'cubic-bezier(.3,.1,.6,1)'},
        {transform:`translate(${sx*.28}px,${sy*.28}px) scale(1)`,offset:.5,easing:'ease-out'},
        {transform:`translate(${-sx*.07}px,${-sy*.07}px) scale(1.22)`,offset:.68,easing:'ease-in'},
        {transform:`translate(${sx*.03}px,${sy*.03}px) scale(1)`,offset:.82,easing:'ease-out'},
        {transform:`translate(${-sx*.008}px,${-sy*.008}px) scale(1.07)`,offset:.92,easing:'ease-in'},
        {transform:'translate(0,0) scale(1)',offset:1}
      ],{duration:dur,delay,fill:'backwards'});
      const rk=()=>(Math.random()<.5?-1:1)*(2+Math.floor(Math.random()*3))*360+Math.random()*360;
      const st=`rotateZ(${z+Math.random()*300-150}deg) rotateX(-14deg) rotateY(12deg) rotateX(${ROT[v][0]+rk()}deg) rotateY(${ROT[v][1]+rk()}deg)`;
      cube.animate([{transform:st},{transform:fin}],{duration:dur*.92,delay,easing:'cubic-bezier(.15,.55,.3,1)',fill:'backwards'});
      sndRoll(delay,dur);
      maxEnd=Math.max(maxEnd,delay+dur);
    }
  });
  rollEnd=animate?Date.now()+maxEnd+120:0;
  if(animate)setTimeout(()=>{renderAction();},maxEnd+140);
}

  <li><b>2인 게임</b>: 각자 8개 + <b>중립 흰색 주사위 8개</b>. 자기 주사위를 놓은 직후 흰색 주사위도 굴려 한 종류를 놓습니다. 흰색은 동점 무효·순위에는 참여하지만 돈은 받지 않습니다.</li>
  <li>라운드마다 시작 플레이어가 왼쪽으로 넘어갑니다. 원작처럼 <b>지폐 금액은 게임 끝까지 비공개</b>(상단 💰로 볼 수 있음).</li>
  </ul><p style="text-align:right"><button class="btn" onclick="closeModal()">닫기</button></p>`);
}

/* ============ 온라인 (Firebase Realtime Database) ============
   lasvegas/rooms/{코드} = { host, status, created, players:{id:{name,t,online}}, state(JSON 문자열) }
   lasvegas/pres/{코드}/{id}  접속 상태(핑)      lasvegas/chat/{코드}  채팅
*/
function initFB(){
  if(db)return true;
  if(FIREBASE_CONFIG.apiKey.startsWith('YOUR')){alert('코드 상단의 FIREBASE_CONFIG를 본인 Firebase 프로젝트 값으로 바꿔주세요.');return false;}
  try{firebase.initializeApp(FIREBASE_CONFIG);db=firebase.database();return true;}
  catch(e){alert('Firebase 초기화 실패: '+e.message);return false;}
}
const TS=()=>firebase.database.ServerValue.TIMESTAMP;
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';},2600);}
function myName(){const n=$('oname').value.trim()||localStorage.lv_name||'플레이어';localStorage.lv_name=n;return n;}
function chatName(){
  if(G&&myIdx>=0&&G.players[myIdx])return G.players[myIdx].name;
  if(RD&&RD.players&&RD.players[myUid]&&RD.players[myUid].name)return RD.players[myUid].name;
  return localStorage.lv_name||'손님';
}
function genCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ';let c='';for(let i=0;i<4;i++)c+=A[Math.floor(Math.random()*A.length)];return c;}
function sortedPlayers(room){
  return Object.entries(room.players||{}).map(([id,p])=>({id,...p})).sort((a,b)=>(a.t||0)-(b.t||0)||a.id.localeCompare(b.id));
}
/* 12시간 넘게 남은 옛 방은 새 방을 만들 때 함께 치운다 */
async function sweepOld(){
  try{
    const cut=serverNow()-12*3600*1000;
    const sn=await db.ref(P_ROOM).orderByChild('created').endAt(cut).limitToFirst(20).once('value');
    sn.forEach(c=>{const code=c.key;
      db.ref(`${P_ROOM}/${code}`).remove();db.ref(`${P_CHAT}/${code}`).remove();db.ref(`${P_PRES}/${code}`).remove();});
  }catch(e){}
}

function attach(code){
  mode='online';roomCode=code;roomRef=db.ref(P_ROOM+'/'+code);RD=null;
  try{localStorage.lv_room=JSON.stringify({code,id:myUid});}catch(e){}
  const on=roomRef.child('players/'+myUid+'/online');
  on.set(true);on.onDisconnect().set(false);
  watchConnection();startPresence(code);attachChat(code);
  if(unsub)unsub();
  const cb=roomRef.on('value',snap=>onRoom(snap.val()));
  unsub=()=>roomRef.off('value',cb);
}
function onRoom(room){
  if(mode!=='online'||!roomRef)return;
  if(!room){toast('방이 사라졌어요');leaveRoom(true);return;}
  RD=room;
  if(room.state){
    const g=JSON.parse(room.state);
    const idx=g.players.findIndex(p=>p.uid===myUid);
    if(idx<0||g.players[idx].left){toast('이 방의 참가자가 아니에요');leaveRoom(true);return;}
    if(G)g.players.forEach((p,i)=>{if(p.left&&G.players[i]&&!G.players[i].left)toast(p.name+'님이 게임에서 나갔어요');});
    G=g;myIdx=idx;
    if($('game').classList.contains('hidden')){resetView();show('game');$('tray').innerHTML='';}
    onState();
  }else{
    G=null;myIdx=-1;
    if(!(room.players&&room.players[myUid])){toast('방에서 나왔어요');leaveRoom(true);return;}
    show('lobby');renderLobby(room);
  }
}
function renderLobby(room){
  lastRoom=room;$('lcode').textContent=roomCode;
  const ps=sortedPlayers(room);
  $('lplayers').innerHTML=ps.map((p,i)=>`<div class="pl" style="--c:${COLORS[i%5].c};margin:5px 0">${mini(6,COLORS[i%5])}<span class="dot ${presCls(p.id)}" data-pid="${p.id}"></span><b>${esc(p.name||'??')}</b>${p.id===room.host?' 👑방장':''}${p.id===myUid?' (나)':''}${p.online===false?' <small>(연결 끊김)</small>':''}</div>`).join('');
  const isHost=room.host===myUid,ready=ps.filter(p=>p.online!==false).length;
  $('lstart').classList.toggle('hidden',!isHost);$('lstart').disabled=ready<2||ready>5;
  $('lwait').textContent=isHost?(ready<2?'2명 이상 모이면 시작할 수 있어요 (최대 5명)':''):'방장이 시작하기를 기다리는 중…';
}
function copyLink(){
  const url=location.href.split('?')[0].split('#')[0]+'?room='+roomCode;
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(url).then(()=>toast('초대 링크를 복사했어요'),()=>toast(url));
  else toast(url);
}
async function createRoom(){
  if(!initFB())return;
  const name=myName();
  try{
    sweepOld();
    for(let t=0;t<10;t++){
      const code=genCode();
      const s=await db.ref(P_ROOM+'/'+code).once('value');
      if(s.exists())continue;
      await db.ref(P_ROOM+'/'+code).set({host:myUid,status:'lobby',created:TS(),players:{[myUid]:{name,t:Date.now(),online:true}}});
      attach(code);return;
    }
    toast('방 생성에 실패했어요. 다시 시도해주세요.');
  }catch(e){toast('방을 만들지 못했어요: '+e.message);}
}
async function joinRoom(codeIn){
  if(!initFB())return;
  const name=myName();
  const code=(typeof codeIn==='string'?codeIn:$('ocode').value).trim().toUpperCase();
  if(code.length!==4){toast('방 코드 4글자를 입력하세요.');return;}
  try{
    const s=await db.ref(P_ROOM+'/'+code).once('value');
    if(!s.exists()){toast('없는 방입니다.');localStorage.removeItem('lv_room');checkRejoin();return;}
    /* 두 사람이 동시에 들어와도 정원(5명)이 넘지 않도록 한 번에 처리 */
    let why='';
    const res=await db.ref(P_ROOM+'/'+code).transaction(r=>{
      if(!r)return r;
      r.players=r.players||{};
      if(r.players[myUid]){r.players[myUid].name=name;r.players[myUid].online=true;why='';return r;}
      if(r.status!=='lobby'){why='이미 시작된 방입니다.';return;}
      if(Object.keys(r.players).length>=5){why='방이 가득 찼습니다. (최대 5명)';return;}
      r.players[myUid]={name,t:Date.now(),online:true};why='';return r;
    },null,false);
    if(why){toast(why);return;}
    const rr=res.snapshot&&res.snapshot.val();
    if(!rr||!rr.players||!rr.players[myUid]){toast('들어가지 못했어요. 다시 해 주세요.');return;}
    attach(code);
  }catch(e){toast('들어가지 못했어요: '+e.message);}
}
function startOnline(){
  if(!lastRoom||lastRoom.host!==myUid||!roomRef)return;
  const ps=sortedPlayers(lastRoom).filter(p=>p.online!==false);
  if(ps.length<2||ps.length>5)return;
  const g=makeGame(ps.map(p=>p.name),ps.map(p=>p.id));
  roomRef.transaction(r=>{
    if(!r||r.status!=='lobby')return;            // 이미 시작됐으면 그대로 둔다
    r.status='playing';r.state=JSON.stringify(g);return r;
  },null,false);
}
function leaveRoom(silent){
  const code=roomCode,ref=roomRef,data=RD;
  if(unsub){unsub();unsub=null;}
  detachChat();stopPresence();
  if(ref&&db&&code){
    const pr=db.ref(`${P_PRES}/${code}/${myUid}`);
    pr.onDisconnect().cancel();
    ref.child('players/'+myUid+'/online').onDisconnect().cancel();
    if(silent===true||!data){pr.remove().catch(()=>{});}
    else{
      const others=Object.keys(data.players||{}).filter(id=>id!==myUid);
      const lastOne=others.every(id=>data.players[id].online===false);
      if(!others.length||lastOne){                       // 마지막 사람이 나가면 방을 통째로 치운다
        ref.remove().catch(()=>{});
        db.ref(`${P_CHAT}/${code}`).remove().catch(()=>{});
        db.ref(`${P_PRES}/${code}`).remove().catch(()=>{});
      }else{
        pr.remove().catch(()=>{});
        if(data.state){                                  // 게임 중이면 판에서도 빠진다
          ref.child('state').transaction(cur=>{
            if(cur==null)return cur;
            try{const s=JSON.parse(cur);if(s.phase==='gameEnd')return;quitPlayer(s,myUid);return JSON.stringify(s);}
            catch(e){return;}
          },null,false);
        }
        ref.child('players/'+myUid).remove().catch(()=>{});
        if(data.host===myUid){
          const nh=others.find(id=>data.players[id].online!==false)||others[0];
          ref.child('host').set(nh).catch(()=>{});
        }
      }
    }
  }
  localStorage.removeItem('lv_room');
  roomRef=null;roomCode=null;RD=null;lastRoom=null;G=null;mode='local';myIdx=-1;resetView();
  closeModal();show('menu');checkRejoin();
}
function checkRejoin(){
  let s=null;try{s=JSON.parse(localStorage.lv_room||'null');}catch(e){}
  $('rejoin').innerHTML=(s&&s.code&&s.id)?`<div class="row"><button class="btn dark sm" onclick="rejoin()">↩ 방 ${esc(s.code)} 다시 들어가기</button></div>`:'';
}
async function rejoin(){
  let s=null;try{s=JSON.parse(localStorage.lv_room||'null');}catch(e){}
  if(!s||!s.code||!s.id)return;
  myUid=s.id;try{sessionStorage.setItem('lv_pid',myUid);}catch(e){}
  await joinRoom(s.code);
}

/* ---------- 접속 감시 ---------- */
function watchConnection(){
  if(connWatched||!db)return;connWatched=true;
  db.ref('.info/serverTimeOffset').on('value',sn=>{srvOffset=sn.val()||0;});
  db.ref('.info/connected').on('value',sn=>{
    selfOffline=sn.val()!==true;
    if(!selfOffline&&roomCode&&roomRef){
      const r=db.ref(`${P_PRES}/${roomCode}/${myUid}`);
      r.onDisconnect().update({connected:false});
      r.update({connected:true,lastSeen:TS()});
      if(RD&&RD.players&&RD.players[myUid]){           // 이미 명단에서 빠진 사람이 다시 만들어지지 않게
        const o=roomRef.child('players/'+myUid+'/online');
        o.onDisconnect().set(false);o.set(true);
      }
    }
    $('connBar').classList.toggle('on',mode==='online'&&selfOffline);
  });
}
function startPresence(code){
  stopPresence();
  const r=db.ref(`${P_PRES}/${code}/${myUid}`);
  r.set({name:chatName(),connected:true,lastSeen:TS(),pingMs:null});
  r.onDisconnect().update({connected:false});
  presRef=db.ref(`${P_PRES}/${code}`);presLoaded=false;enterAt=Date.now();
  presRef.on('value',sn=>{PRES=sn.val()||{};presLoaded=true;paintPresence();});
  pingTimer=setInterval(()=>{
    if(mode!=='online'||roomCode!==code)return;
    const t0=Date.now();
    r.update({lastSeen:TS()}).then(()=>{if(roomCode===code)r.update({pingMs:Date.now()-t0,connected:true});}).catch(()=>{});
  },PING_MS);
  presTimer=setInterval(paintPresence,1000);
}
function stopPresence(){
  clearInterval(pingTimer);pingTimer=null;
  clearInterval(presTimer);presTimer=null;
  if(presRef){presRef.off();presRef=null;}
  PRES={};presLoaded=false;
}
function presCls(id){
  const m=PRES[id];
  if(!m)return 'off';
  if(m.connected===false)return 'stale';
  if(m.lastSeen&&serverNow()-m.lastSeen>STALE_MS)return 'stale';
  return m.pingMs==null?'mid':(m.pingMs<150?'good':m.pingMs<400?'mid':'bad');
}
function paintPresence(){
  $('connBar').classList.toggle('on',mode==='online'&&selfOffline);
  if(mode!=='online')return;
  maybeMoveHost();
  document.querySelectorAll('.dot[data-pid]').forEach(el=>{el.className='dot '+presCls(el.dataset.pid);});
  renderAway();
}
/* 방장이 오래 사라지면 남은 사람 중 가장 먼저 들어온 사람이 방장을 이어받는다 */
function maybeMoveHost(){
  if(!RD||!roomRef||RD.host===myUid)return;
  const h=PRES[RD.host],hostHere=!!(RD.players&&RD.players[RD.host]);
  if(hostHere&&h&&h.lastSeen&&serverNow()-h.lastSeen<TAKEOVER_MS)return;
  if(Date.now()-hostTryAt<5000)return;
  const alive=Object.entries(RD.players||{}).sort((a,b)=>(a[1].t||0)-(b[1].t||0)).map(([id])=>id)
    .filter(id=>{const m=PRES[id];return m&&m.connected!==false&&serverNow()-(m.lastSeen||0)<STALE_MS;});
  if(!alive.length||alive[0]!==myUid)return;
  hostTryAt=Date.now();const gone=RD.host;
  roomRef.child('host').transaction(cur=>(cur===gone?myUid:undefined),(e,done)=>{
    if(!e&&done)toast('방장이 오래 안 보여서 내가 방장이 됐어요');
  },false);
}

/* ---------- 연결 끊긴 사람 대신 진행 ---------- */
function renderAway(){
  const el=$('away');if(!el)return;
  let h='';
  if(mode==='online'&&G&&(G.phase==='roll'||G.phase==='choose')&&G.turn!==myIdx&&G.players[G.turn]&&!G.players[G.turn].left){
    const p=G.players[G.turn],m=PRES[p.uid];
    const away=presLoaded&&(m?serverNow()-(m.lastSeen||0)>AWAY_MS:Date.now()-enterAt>AWAY_MS);
    if(away)h=`<div class="awaybox">🔌 <b>${esc(p.name)}</b>님의 연결이 끊긴 것 같아요.<br><button class="btn sm" onclick="autoTurn()">⏩ 대신 자동으로 진행</button> <small>(굴린 뒤 가장 많이 나온 눈을 놓아요)</small></div>`;
  }
  if(el.dataset.h!==h){el.dataset.h=h;el.innerHTML=h;}   // 바뀔 때만 다시 그려 버튼 클릭이 씹히지 않게
}
function autoTurn(){
  if(mode!=='online'||!G||!roomRef||G.turn===myIdx)return;
  if(!(G.phase==='roll'||G.phase==='choose'))return;
  const snap={round:G.round,turn:G.turn,actor:G.actor,phase:G.phase,seq:G.tray.seq};
  const g=clone(G);
  if(g.phase==='roll')doRoll(g);
  const cnt={};g.tray.values.forEach(v=>cnt[v]=(cnt[v]||0)+1);
  let best=0,bv=0;
  for(const [v,n] of Object.entries(cnt)){if(n>best||(n===best&&+v>bv)){best=n;bv=+v;}}
  if(!bv)return;
  doPlace(g,bv);
  roomRef.child('state').transaction(cur=>{
    if(cur==null)return cur;
    try{const c=JSON.parse(cur);
      if(c.round!==snap.round||c.turn!==snap.turn||c.actor!==snap.actor||c.phase!==snap.phase||c.tray.seq!==snap.seq)return;
    }catch(e){return;}
    return JSON.stringify(g);
  },null,false);
}

/* =========================================================
   채팅 (온라인 방에서만)
   ========================================================= */
const BAD_WORDS=['시발','씨발','씨팔','시팔','ㅅㅂ','개새끼','개색기','새꺄','병신','ㅂㅅ','좆','좇',
  '존나','존내','걸레','창녀','미친놈','미친년','지랄','닥쳐','꺼져','뒤져','죽어라',
  '한남충','한녀충','틀딱','급식충','맘충','fuck','fucking','shit','bitch','asshole','bastard','nigger','retard'];
const CHAT_MAX=150,CHAT_COOL=1200,CHAT_DUP=15000;
let chatRef=null,chatCb=null,chatOpen=false,chatUnread=0,lastSentAt=0,lastSentText='';

function chatTip(m){
  const t=$('chatTip');t.textContent=m;t.classList.add('on');
  clearTimeout(chatTip._t);chatTip._t=setTimeout(()=>t.classList.remove('on'),1800);
}
const squash=t=>t.replace(/(.)\1{7,}/g,(m,c)=>c.repeat(8));
/* 띄어쓰기·기호로 피해 가는 것도 잡도록, 기호를 뺀 축약본에서 찾아 원래 자리를 *로 가림 */
function maskBad(text){
  const skip=/[\s.,!?~^*\-_'"]/;
  let plain='';const map=[];
  for(let i=0;i<text.length;i++){if(!skip.test(text[i])){plain+=text[i];map.push(i);}}
  const low=plain.toLowerCase(),chars=text.split('');let hit=false;
  for(const w0 of BAD_WORDS){
    const w=w0.toLowerCase();if(!w)continue;
    let from=0,pos;
    while((pos=low.indexOf(w,from))!==-1){hit=true;for(let k=0;k<w.length;k++)chars[map[pos+k]]='*';from=pos+w.length;}
  }
  return {text:chars.join(''),hit};
}
/* 자음만 있는 메시지는 막되 ㅋㅋㅋ·ㅎㅎㅎ 웃음은 허용 */
function onlyJamo(t){
  const x=t.replace(/\s+/g,'');
  if(!x||/^[ㅋㅎ]+$/.test(x))return false;
  return /^[ㄱ-ㅎ]+$/.test(x);
}
function chatBadge(){
  const b=$('chatBadge');
  if(chatUnread>0){b.textContent=chatUnread>9?'9+':chatUnread;b.classList.add('on');}
  else b.classList.remove('on');
}
function toggleChat(v){
  chatOpen=(typeof v==='boolean')?v:!chatOpen;
  $('chatBox').classList.toggle('on',chatOpen);
  if(chatOpen){chatUnread=0;chatBadge();const l=$('chatLog');l.scrollTop=l.scrollHeight;$('chatInput').focus();}
}
function paintChat(list){
  const box=$('chatLog');
  if(!list.length){box.innerHTML='<div class="chat-none">아직 메시지가 없어요. 먼저 인사해 보세요!</div>';return;}
  box.innerHTML=list.map(m=>m?`<div class="chat-m${m.id===myUid?' me':''}"><span class="who">${esc(m.name||'??')}</span>${esc(maskBad(String(m.text||'')).text)}</div>`:'').join('');
  box.scrollTop=box.scrollHeight;
}
function attachChat(code){
  if(!db)return;
  detachChat();
  $('chatBtn').classList.add('on');
  lastSentAt=0;lastSentText='';chatUnread=0;chatBadge();
  chatRef=db.ref(`${P_CHAT}/${code}`).limitToLast(50);
  let first=true;
  chatCb=chatRef.on('value',sn=>{
    const v=sn.val()||{},list=Object.keys(v).sort().map(k=>v[k]);
    paintChat(list);
    const last=list[list.length-1];
    if(!first&&!chatOpen&&last&&last.id!==myUid){chatUnread++;chatBadge();}
    first=false;
  });
}
function detachChat(){
  if(chatRef&&chatCb)chatRef.off('value',chatCb);
  chatRef=null;chatCb=null;chatOpen=false;chatUnread=0;
  $('chatBtn').classList.remove('on');
  $('chatBox').classList.remove('on');
  $('chatLog').innerHTML='';
  chatBadge();
}
function sendChat(){
  const input=$('chatInput');
  let text=input.value.trim();
  if(!text||mode!=='online'||!db||!roomCode)return;
  if(onlyJamo(text))return chatTip('🔤 초성만으로는 보낼 수 없어요');
  const now=Date.now();
  if(now-lastSentAt<CHAT_COOL)return chatTip('⏱️ 너무 빨라요! 잠시 후에 보내요');
  if(text===lastSentText&&now-lastSentAt<CHAT_DUP)return chatTip('🔁 같은 메시지는 잠시 뒤에 보낼 수 있어요');
  text=squash(text).slice(0,CHAT_MAX);
  const {text:masked,hit}=maskBad(text);
  text=masked;lastSentAt=now;lastSentText=text;
  if(hit)chatTip('⚠️ 거친 표현은 별표로 가렸어요');
  db.ref(`${P_CHAT}/${roomCode}`).push({id:myUid,name:chatName(),text,ts:TS()});
  input.value='';
}
$('chatBtn').onclick=()=>toggleChat();
$('chatClose').onclick=()=>toggleChat(false);
$('chatSend').onclick=sendChat;
$('chatInput').addEventListener('keydown',e=>{
  if(e.key!=='Enter'||e.isComposing||e.keyCode===229)return;   // 한글 조합 중 Enter는 무시
  e.preventDefault();sendChat();
});

/* ============ 시작 ============ */
buildNames();checkRejoin();
$('oname').value=localStorage.lv_name||'';
try{const q=new URLSearchParams(location.search).get('room');if(q){$('ocode').value=q.toUpperCase().slice(0,4);menuPane('online');}}catch(e){}
</script>
